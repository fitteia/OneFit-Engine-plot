name: CI

# Every pull request and push to main, and once a week: the tests inside
# Debian containers - trixie (stable, must pass) and forky (testing, the
# next stable: allowed to fail, an early warning; the weekly run catches it
# moving between pushes).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (debian ${{ matrix.debian }})
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.debian }}
    continue-on-error: ${{ matrix.debian == 'forky' }}
    strategy:
      fail-fast: false
      matrix:
        debian: [trixie, forky]
    steps:
      # git first, so actions/checkout makes a real git checkout; gcc for
      # the race detector (it needs cgo); Ghostscript and Poppler for the
      # pixel comparisons with gracebat's references; librsvg's
      # rsvg-convert for the SVG ones (without it those tests skip); the
      # URW fonts, which
      # plot-go measures text with as gracebat does (Ghostscript depends on
      # them, named here so the tests never run without them)
      - name: Debian packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates gcc libc6-dev \
            ghostscript poppler-utils fonts-urw-base35 librsvg2-bin

      - uses: actions/checkout@v5

      # in the container git refuses the checkout (owned by the runner, not
      # root) unless it is marked safe - go build's version stamp needs it
      - name: Mark the checkout safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # the race detector makes the whole-corpus pixel comparisons eight
      # times slower and finds nothing in them (no goroutines): -short
      # skips those, the step above runs them
      - name: go test (race detector)
        run: go test -race -short ./...

  windows-raster:
    name: Windows Ghostscript PNG and TIFF
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install Ghostscript
        run: choco install ghostscript --yes --no-progress
      - name: Check native console executable discovery and raster exports
        run: go test -v ./raster -run 'TestWindowsGhostscriptDiscovery|TestGhostscriptRaster|TestRasterValidation'
        env:
          PLOT_GO_REQUIRE_GS: '1'
