name: Release

# On a version tag ("git tag v0.1.0 && git push origin v0.1.0"): plot-go
# built for Linux (amd64, arm64), macOS (Intel, Apple Silicon) and Windows,
# published as a GitHub Release with SHA256SUMS. OneFit's installers
# download the binary for their platform from the latest release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # the tests as CI runs them (ci.yml): in Debian, with the URW fonts
    # plot-go measures text with - without them legends and texts move and
    # the tests fail, and nothing is published
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Debian packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates \
            ghostscript poppler-utils fonts-urw-base35

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Build every platform
        # go build stamps the git version into the binaries; in the
        # container git refuses the checkout (owned by the runner, not
        # root) unless it is marked safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-release.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plot-go_*
            dist/SHA256SUMS
            dist/LICENSE
            dist/NOTICE
            dist/MustRead.html
          generate_release_notes: true
