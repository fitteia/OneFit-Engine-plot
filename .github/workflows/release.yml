name: Release

# On a version tag ("git tag v0.1.0 && git push origin v0.1.0"): plot-go
# built for Linux (amd64, arm64), macOS (Intel, Apple Silicon) and Windows,
# published as a GitHub Release with SHA256SUMS. OneFit's installers
# download the binary for their platform from the latest release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build every platform
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-release.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plot-go_*
            dist/SHA256SUMS
          generate_release_notes: true
